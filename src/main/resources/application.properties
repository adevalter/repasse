# Configuracoes basicas da aplicacao
spring.application.name=repasse
server.port=${SRV_PORT:9595}
server.servlet.context-path=/api
# Configuracoes de banco de dados - MariaDB
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_HOST:jdbc:mysql://localhost:3306/awrepasse?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:SenhaLocal123}
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1 FROM DUAL

# Configuracoes do Hibernate/JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Configuracoes do Jackson (JSON) #habilita para nao aceitar propriedades que nao existe
spring.jackson.deserialization.fail-on-unknown-properties=true
#habilita para nao aceitar quando a opcao json-ingore esta em uso
spring.jackson.deserialization.fail-on-ignored-properties=true

#spring.flyway.locations=classpath:db/migration,classpath:db/testdata
# Configuracoes de recursos
spring.web.resources.add-mappings=false

# Configuraoes adicionais recomendadas (descomente se necessario)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Configurao do pool de conexoes HikariCP (recomendado)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
 spring.datasource.hikari.max-lifetime=1800000

security.jwt.secret-key=3cfa76ef1493affe347c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000

